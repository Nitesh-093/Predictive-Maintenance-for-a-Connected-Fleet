    <script>
      // Suppress benign Vite HMR WebSocket connection failure notices in iframe / Cloud Run environment
      (function() {
        var isWsError = function(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || err.reason || String(err));
          return /websocket/i.test(msg) || /ws.*closed/i.test(msg) || /failed to connect to websocket/i.test(msg);
        };
        var origConsoleError = console.error;
        console.error = function() {
          var firstArg = arguments[0];
          if (firstArg && isWsError(firstArg)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
        window.addEventListener('error', function(event) {
          if (isWsError(event.error) || isWsError(event.message)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
      })();
    </script>
